<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <title>Cache Memory Simulator</title>
  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#161b22"/>
  <!-- Block 0 - Cache Hit (green) -->
  <rect x="4" y="2" width="24" height="6" rx="1.5" fill="#22c55e" fill-opacity="0.2" stroke="#22c55e" stroke-width="1"/>
  <!-- Block 1 - Empty -->
  <rect x="4" y="9.5" width="24" height="6" rx="1.5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <!-- Block 2 - Empty -->
  <rect x="4" y="17" width="24" height="6" rx="1.5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <!-- Block 3 - Empty -->
  <rect x="4" y="24.5" width="24" height="6" rx="1.5" fill="#21262d" stroke="#30363d" stroke-width="1"/>
</svg>
